plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atube.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.atube.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "device"
    productFlavors {
        tv {
            dimension "device"
            applicationIdSuffix ".tv"
            versionNameSuffix "-tv"
        }
        mobile {
            dimension "device"
            applicationIdSuffix ".mobile"
            versionNameSuffix "-mobile"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets'] 
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.core:core-splashscreen:1.0.1' // Modern Android Splash Screen
}

task copyWebAssets(type: Copy) {
    from('../../') {
        include 'index.html'
        include 'catalog.json'
        include 'css/**'
        include 'js/**'
        include 'data/**'
        include 'assets/**'
    }
    into 'src/main/assets'
}

preBuild.dependsOn(copyWebAssets)
