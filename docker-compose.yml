version: '3.8'

services:
  atube:
    build: .
    container_name: atube-media-platform
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - PORT=8085
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8085/api/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
