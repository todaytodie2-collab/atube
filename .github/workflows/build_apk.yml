name: Build Android TV & Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'catalog.json'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# Prevent concurrent APK builds from interfering with each other.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle CLI
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Bundle Web Assets into Android App
        run: |
          mkdir -p android_app/app/src/main/assets
          cp index.html catalog.json android_app/app/src/main/assets/
          cp -r css js assets data android_app/app/src/main/assets/

      - name: Build Android Dual APKs (TV & Mobile)
        working-directory: ./android_app
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p output_apk
          if [ -f android_app/app/build/outputs/apk/tv/debug/app-tv-debug.apk ]; then
            cp android_app/app/build/outputs/apk/tv/debug/app-tv-debug.apk output_apk/Atube_tv.apk
          fi
          if [ -f android_app/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk ]; then
            cp android_app/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk output_apk/Atube_mopile.apk
          fi
          if [ -f android_app/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android_app/app/build/outputs/apk/debug/app-debug.apk output_apk/ATuBe_Universal.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ATuBe-Dual-APKs
          path: output_apk/*

      # Only publish a GitHub Release when a version tag (v*) is pushed.
      - name: Create Release and Upload APK Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "A TuBe Ultra HD - Android APK (TV & Mobile) ${{ github.ref_name }}"
          body: |
            ## A TuBe Ultra HD - Universal Android App ${{ github.ref_name }}
            
            - **Compatible with:** Android TV, Google TV, Fire TV, and Android Phones & Tablets.
            - **Features:**
              - 141 Live FTA Channels with EPG Guide and Nilesat/Arabsat Frequencies.
              - Full D-Pad TV Remote Control navigation.
              - Real-time cloud synchronization with zero lag.
              - Immersive 4K / 1080p video player with multi-source server failover.
          files: |
            output_apk/Atube_tv.apk
            output_apk/Atube_mopile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
