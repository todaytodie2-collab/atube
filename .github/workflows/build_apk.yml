name: Build Android TV & Mobile APK

on:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'
    tags:
      - 'v*'        # Only create a release when a version tag is pushed (e.g. v1.0.1)
  workflow_dispatch:

# Prevent concurrent APK builds from interfering with each other.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle CLI
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Bundle Web Assets into Android App
        run: |
          mkdir -p android_app/app/src/main/assets
          cp index.html catalog.json android_app/app/src/main/assets/
          cp -r css js assets data android_app/app/src/main/assets/

      - name: Build Android APK
        working-directory: ./android_app
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p output_apk
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output_apk/ATuBe.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATuBe-UltraHD-APK
          path: output_apk/ATuBe.apk

      # Only publish a GitHub Release when a version tag (v*) is pushed.
      # Avoids the "tag already exists" error that occurred on every main push.
      - name: Create Release and Upload APK Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "A TuBe Ultra HD - Android APK (TV & Mobile) ${{ github.ref_name }}"
          body: |
            ## A TuBe Ultra HD - Universal Android App ${{ github.ref_name }}
            
            - **Compatible with:** Android TV, Google TV, Fire TV, and Android Phones & Tablets.
            - **Features:**
              - Full D-Pad TV Remote Control navigation.
              - Real-time cloud synchronization with zero lag.
              - Immersive 4K / 1080p video player with multi-source server failover.
          files: |
            output_apk/ATuBe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
