name: A TuBe Smart Cloud Harvester & Aggregator

on:
  schedule:
    # Runs every 6 hours but OFFSET by 3 hours from harvester.yml (which runs at 00,06,12,18)
    # This runs at 03:00, 09:00, 15:00, 21:00 UTC to avoid concurrent catalog.json conflicts.
    - cron: '0 3/6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

# Share the same concurrency group as harvester.yml so they can never
# run at the same time and corrupt catalog.json simultaneously.
concurrency:
  group: harvester
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest_and_aggregate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚡ Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: 🚀 Run Universal Cloud Harvester & Stream Aggregator
        run: |
          python test_scripts/run_cloud_harvester.py

      - name: 📤 Commit & Push Updated Data to GitHub Pages
        run: |
          git config --global user.name "ATube Cloud Bot"
          git config --global user.email "bot@atube.app"
          # Add only files that actually exist to avoid git add errors
          git add catalog.json || true
          git add js/bundled-data.js || true
          git add QA_Report.md || true
          git add Deep_QA_Report.md || true
          if git diff --staged --quiet; then
            echo "No new updates found."
          else
            git commit -m "⚡ [Cloud Bot] Auto-Harvest & Stream Aggregation Update [skip ci]"
            git push origin main
          fi
