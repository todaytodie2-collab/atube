name: A TuBe Smart Cloud Harvester & Aggregator

on:
  schedule:
    # Runs automatically every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  harvest_and_aggregate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚡ Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: 🚀 Run Universal Cloud Harvester & Stream Aggregator
        run: |
          python test_scripts/run_cloud_harvester.py

      - name: 📤 Commit & Push Updated Data to GitHub Pages
        run: |
          git config --global user.name "ATube Cloud Bot"
          git config --global user.email "bot@atube.app"
          git add catalog.json js/bundled-data.js QA_Report.md Deep_QA_Report.md
          if git diff --staged --quiet; then
            echo "No new updates found."
          else
            git commit -m "⚡ [Cloud Bot] Auto-Harvest & Stream Aggregation Update"
            git push origin main
          fi
