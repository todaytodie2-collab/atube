name: A TuBe 24/7 Cloud Harvester

on:
  schedule:
    # Runs every 6 hours instead of every 10 minutes.
    # Previous schedule (*/10 * * * *) caused 144 runs/day → exhausted free
    # GitHub Actions minutes quota and flooded the inbox with failure emails.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

# Prevent concurrent runs from corrupting catalog.json simultaneously.
concurrency:
  group: harvester
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Multi-Portal Harvester & Complete Missing Episodes
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'services')
          from catalog_sync import ContentIngestEngine, ContinuousSyncEngine
          print('--- Starting Cloud Harvest Cycle with Deep Multi-Page Crawling ---')
          try:
              ContentIngestEngine.harvest_multi_portal(items_per_portal=40, min_page=1, max_page=30)
          except Exception as e:
              print('Harvest multi-portal note:', e)

          try:
              ContinuousSyncEngine.run_sync_cycle()
          except Exception as e:
              print('Continuous cycle note:', e)
          print('--- Cloud Harvest Step Finished ---')
          "
          python services/db_cleanup.py
          echo "--- Cloud Harvest & Series Consolidation Completed Successfully ---"

      - name: Commit and Push Updated Catalog
        run: |
          git config --global user.name "ATuBe-Harvester-Bot"
          git config --global user.email "bot@atube.app"
          # Add only files that actually exist to avoid git add errors
          git add catalog.json || true
          git add config/atube_data.sqlite || true
          git diff-index --quiet HEAD || (git commit -m "Auto-harvester: Added new releases & completed episodes [skip ci]" && git push)
